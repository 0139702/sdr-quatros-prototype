# netlify.toml
# Netlify 배포 설정

[build]
  publish = "scripts"
  functions = "netlify/functions"
 
# /api/* 경로를 Netlify Functions로 연결
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
 
# SPA처럼 404를 index.html로 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200